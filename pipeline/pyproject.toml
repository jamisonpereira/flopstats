[project]
name = "flopstats"
version = "0.1.0"
description = "Flopstats pipeline: football data, flop detection and review queue"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rapidfuzz>=3.9",
    "typer>=0.12",
]

[project.scripts]
flopstats = "flopstats.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flopstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
